<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock Batch *</label>
        {{ form.stock_batch }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled Date *</label>
            {{ form.scheduled_date }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
            {{ form.status }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Quantity (count)</label>
            {{ form.estimated_quantity }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Total Weight (kg)</label>
            {{ form.estimated_total_weight }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Target Weight Per Fish (g)</label>
        {{ form.target_weight }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
