<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock Batch *</label>
        {{ form.stock_batch }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harvest Schedule</label>
            {{ form.harvest_schedule }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harvest Date *</label>
            {{ form.harvest_date }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Quantity Harvested (count) *</label>
            {{ form.quantity_harvested }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Weight (kg) *</label>
            {{ form.total_weight_kg }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Average Weight Per Fish (g) *</label>
        {{ form.average_weight_per_fish }}
    </div>
    <fieldset class="border border-gray-300 rounded-lg p-4">
        <legend class="text-sm font-semibold text-gray-900 px-2">Quality Grading</legend>
        <div class="grid grid-cols-3 gap-4 mt-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Grade A (Premium) *</label>
                {{ form.grade_a_quantity }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Grade B (Standard) *</label>
                {{ form.grade_b_quantity }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Grade C (Below Std) *</label>
                {{ form.grade_c_quantity }}
            </div>
        </div>
    </fieldset>
    <div>
        <label class="flex items-center">
            <input type="checkbox" class="rounded" name="is_partial_harvest" {% if form.is_partial_harvest.value %}checked{% endif %}>
            <span class="ml-2 text-sm text-gray-700">Is Partial Harvest</span>
        </label>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
