<div class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Customer *</label>
            {{ form.customer }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Order Type *</label>
            {{ form.order_type }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Product *</label>
            {{ form.product }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Harvest Record</label>
            {{ form.harvest_record }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Order Date *</label>
            {{ form.order_date }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Date</label>
            {{ form.delivery_date }}
        </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Quantity (kg) *</label>
            {{ form.quantity_kg }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Price Per kg (₱) *</label>
            {{ form.price_per_kg }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Discount (₱)</label>
            {{ form.discount }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
            {{ form.status }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Payment Status *</label>
            {{ form.payment_status }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Address</label>
        {{ form.delivery_address }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
