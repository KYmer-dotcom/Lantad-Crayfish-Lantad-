<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-white/10">
        <thead class="bg-white/[0.03]">
            <tr>
                <th class="px-6 py-4 text-left text-xs font-black text-[#a0ac96] uppercase tracking-[0.15em]">Customer</th>
                <th class="px-6 py-4 text-left text-xs font-black text-[#a0ac96] uppercase tracking-[0.15em]">Qty (kg)</th>
                <th class="px-6 py-4 text-left text-xs font-black text-[#a0ac96] uppercase tracking-[0.15em]">Amount (₱)</th>
                <th class="px-6 py-4 text-left text-xs font-black text-[#a0ac96] uppercase tracking-[0.15em]">Payment</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-white/5 bg-transparent">
            {% for order in orders %}
            <tr class="hover:bg-white/[0.03] transition-colors duration-200">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-stone-300">{{ order.customer.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-[#cca43b]">{{ order.quantity_kg }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-mono font-bold text-[#cca43b]">{{ order.total_amount|floatformat:2 }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm">
                    <span class="px-2.5 py-1 inline-flex text-[10px] font-black rounded-full uppercase tracking-wider border
                        {% if order.payment_status == 'paid' %}bg-emerald-500/10 text-emerald-400 border-emerald-500/20
                        {% elif order.payment_status == 'partial' %}bg-amber-500/10 text-amber-400 border-amber-500/20
                        {% else %}bg-rose-500/10 text-rose-400 border-rose-500/20{% endif %}">
                        {{ order.get_payment_status_display }}
                    </span>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="px-6 py-8 text-center text-sm text-stone-500">No orders registered</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
