<div class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
            {{ form.name }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
            {{ form.category }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Species</label>
            {{ form.species }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Source Pond</label>
            {{ form.pond }}
        </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Stock (kg) *</label>
            {{ form.quantity_kg }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Reorder Level (kg)</label>
            {{ form.reorder_level_kg }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Unit Price (₱) *</label>
            {{ form.unit_price }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
    <div>
        <label class="flex items-center">
            <input type="checkbox" class="rounded" name="is_active" {% if form.is_active.value %}checked{% endif %}>
            <span class="ml-2 text-sm text-gray-700">Is Active</span>
        </label>
    </div>
</div>
