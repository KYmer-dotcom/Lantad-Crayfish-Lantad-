<div class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#a0ac96] mb-1">Order *</label>
            {{ form.order }}
        </div>
        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#a0ac96] mb-1">Assign Rider</label>
            {{ form.rider }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled Date *</label>
            {{ form.scheduled_date }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
            {{ form.status }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Delivered Date</label>
            {{ form.delivered_date }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Quantity (kg) *</label>
            {{ form.quantity_kg }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Delivery Location *</label>
        {{ form.delivery_location }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
