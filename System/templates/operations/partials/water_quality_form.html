<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pond *</label>
        {{ form.pond }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Record Date & Time *</label>
            {{ form.recorded_at }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Temperature (°C) *</label>
            {{ form.temperature }}
        </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">pH Level *</label>
            {{ form.ph_level }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Dissolved Oxygen (mg/L) *</label>
            {{ form.dissolved_oxygen }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ammonia Level (mg/L)</label>
            {{ form.ammonia_level }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
