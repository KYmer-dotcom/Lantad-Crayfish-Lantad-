<div class="space-y-4">
    <div id="field-category">
        <label class="block text-xs font-semibold text-[#a0ac96] mb-1">Category *</label>
        {{ form.category }}
    </div>
    <div id="field-name">
        <label class="block text-xs font-semibold text-[#a0ac96] mb-1">Name *</label>
        {{ form.name }}
    </div>
    <div id="field-product">
        <label id="label-product" class="block text-xs font-semibold text-[#a0ac96] mb-1">Product *</label>
        {{ form.product_name }}
    </div>

    <!-- Standard / Product 1 Quantity Field -->
    <div id="field-quantity">
        <label id="label-quantity" class="block text-xs font-semibold text-[#a0ac96] mb-1">Quantity *</label>
        {{ form.capacity }}
    </div>

    <!-- Product 2 & Quantity 2 (Only for Breeding Pond) -->
    <div id="field-product-2" class="hidden">
        <label class="block text-xs font-semibold text-[#a0ac96] mb-1">Product 2 (Crilings / Dual Tracking)</label>
        {{ form.product_name_2 }}
    </div>
    <div id="field-quantity-2" class="hidden">
        <label class="block text-xs font-semibold text-[#a0ac96] mb-1">Quantity 2</label>
        {{ form.capacity_2 }}
    </div>

    <!-- Date Transferred Field -->
    <div id="field-date">
        <label id="label-date" class="block text-xs font-semibold text-[#a0ac96] mb-1">Date Transferred</label>
        {{ form.transfer_date }}
    </div>

    <!-- Status Field -->
    {% if form.instance.pk %}
    <div id="field-status">
        <label class="block text-xs font-semibold text-[#a0ac96] mb-1">Status</label>
        {{ form.status }}
    </div>
    {% endif %}

    <!-- Hidden Shelf Position -->
    {{ form.shelf_position }}
</div>

<script>
const CATEGORY_ALLOWED_PRODUCTS = {
    'Main Pond': ['Crayfish'],
    'Breeding Pond': ['Breeder Crayfish', 'Crilings'],
    'Superworm Cabin': ['Superworm'],
    'Azula': ['Azula']
};

function syncProductOptions(form) {
    let categorySelect = form.querySelector('select[name="category"]');
    let p1Select = form.querySelector('select[name="product_name"]');
    let p2Select = form.querySelector('select[name="product_name_2"]');
    if (!p1Select) return;

    let category = categorySelect ? categorySelect.value : 'Main Pond';
    let allowed = CATEGORY_ALLOWED_PRODUCTS[category] || [];

    let p1Val = p1Select.value;
    let p2Val = p2Select ? p2Select.value : '';

    // Filter p1 options based on category and p2Val (if in Breeding Pond)
    Array.from(p1Select.options).forEach(opt => {
        if (!opt.value) {
            opt.hidden = false;
            opt.disabled = false;
            return;
        }
        let isAllowed = allowed.includes(opt.value);
        if (category === 'Breeding Pond' && p2Val && opt.value === p2Val) {
            isAllowed = false;
        }
        opt.hidden = !isAllowed;
        opt.disabled = !isAllowed;
    });

    if (p1Select.value && !allowed.includes(p1Select.value)) {
        p1Select.value = '';
    }

    // Filter p2 options based on category and p1Val
    if (p2Select) {
        Array.from(p2Select.options).forEach(opt => {
            if (!opt.value) {
                opt.hidden = false;
                opt.disabled = false;
                return;
            }
            let isAllowed = allowed.includes(opt.value);
            if (category === 'Breeding Pond' && p1Select.value && opt.value === p1Select.value) {
                isAllowed = false;
            }
            opt.hidden = !isAllowed;
            opt.disabled = !isAllowed;
        });

        if (p2Select.value && (!allowed.includes(p2Select.value) || (category === 'Breeding Pond' && p2Select.value === p1Select.value))) {
            p2Select.value = '';
        }
    }
}

function togglePondFormFields() {
    let forms = document.querySelectorAll('form');
    forms.forEach(form => {
        let categorySelect = form.querySelector('select[name="category"]');
        let p1Select = form.querySelector('select[name="product_name"]');
        let p2Select = form.querySelector('select[name="product_name_2"]');
        if (!categorySelect) return;
        
        let updateFields = () => {
            let category = categorySelect.value;
            
            let fieldProduct2 = form.querySelector('#field-product-2');
            let fieldQuantity2 = form.querySelector('#field-quantity-2');
            let labelProduct = form.querySelector('#label-product');
            let labelQuantity = form.querySelector('#label-quantity');
            let labelDate = form.querySelector('#label-date');
            let capacityInput = form.querySelector('input[name="capacity"]');
            
            let fieldQuantity = form.querySelector('#field-quantity');
            let fieldDate = form.querySelector('#field-date');
            
            if (category === 'Breeding Pond') {
                if (fieldProduct2) fieldProduct2.classList.remove('hidden');
                if (fieldQuantity2) fieldQuantity2.classList.remove('hidden');
                if (fieldQuantity) fieldQuantity.classList.remove('hidden');
                if (fieldDate) fieldDate.classList.remove('hidden');
                if (labelProduct) labelProduct.textContent = 'Product 1 *';
                if (labelQuantity) labelQuantity.textContent = 'Quantity 1 *';
                if (capacityInput) capacityInput.placeholder = 'Quantity 1';
            } else if (category === 'Main Pond') {
                if (fieldProduct2) fieldProduct2.classList.add('hidden');
                if (fieldQuantity2) fieldQuantity2.classList.add('hidden');
                if (fieldQuantity) {
                    fieldQuantity.classList.add('hidden');
                    if (capacityInput && !capacityInput.value) capacityInput.value = '0';
                }
                if (fieldDate) fieldDate.classList.add('hidden');
                if (labelProduct) labelProduct.textContent = 'Product';
            } else {
                if (fieldProduct2) fieldProduct2.classList.add('hidden');
                if (fieldQuantity2) fieldQuantity2.classList.add('hidden');
                if (fieldQuantity) fieldQuantity.classList.remove('hidden');
                if (fieldDate) fieldDate.classList.remove('hidden');
                if (labelProduct) labelProduct.textContent = 'Product *';
                
                if (category === 'Superworm Cabin') {
                    if (labelQuantity) labelQuantity.textContent = 'Darkling Beetles *';
                    if (capacityInput) capacityInput.placeholder = 'Darkling Beetles';
                } else {
                    if (labelQuantity) labelQuantity.textContent = 'Quantity *';
                    if (capacityInput) capacityInput.placeholder = 'Quantity';
                }
            }
            
            if (labelDate) {
                if (category === 'Superworm Cabin') {
                    labelDate.textContent = 'Production Date';
                } else {
                    labelDate.textContent = 'Date Transferred';
                }
            }

            syncProductOptions(form);
        };

        categorySelect.removeEventListener('change', updateFields);
        categorySelect.addEventListener('change', updateFields);

        if (p1Select) {
            p1Select.addEventListener('change', () => syncProductOptions(form));
        }
        if (p2Select) {
            p2Select.addEventListener('change', () => syncProductOptions(form));
        }
        
        updateFields();
    });
}

document.addEventListener("DOMContentLoaded", togglePondFormFields);
togglePondFormFields();
</script>
