<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 border border-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Pond Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Farm</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Size (m²)</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Capacity</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Stock</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for pond in ponds %}
            <tr class="hover:bg-gray-50 transition">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ pond.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ pond.farm.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ pond.size }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ pond.capacity }}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full
                        {% if pond.status == 'active' %}bg-green-100 text-green-800
                        {% elif pond.status == 'maintenance' %}bg-yellow-100 text-yellow-800
                        {% elif pond.status == 'empty' %}bg-gray-100 text-gray-800
                        {% else %}bg-blue-100 text-blue-800{% endif %}">
                        {{ pond.get_status_display }}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{{ pond.current_stock_count }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <a href="#" class="text-blue-600 hover:text-blue-900">Edit</a>
                    <a href="#" class="ml-4 text-red-600 hover:text-red-900">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">No ponds found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
