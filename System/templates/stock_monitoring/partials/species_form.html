<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Species Name *</label>
        {{ form.name }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
            {{ form.category }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Scientific Name</label>
            {{ form.scientific_name }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Average Growth Rate (g/day)</label>
            {{ form.average_growth_rate }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Market Weight (g)</label>
            {{ form.market_weight_g }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        {{ form.description }}
    </div>
    <fieldset class="border border-gray-300 rounded-lg p-4">
        <legend class="text-sm font-semibold text-gray-900 px-2">Optimal Water Conditions</legend>
        <div class="grid grid-cols-2 gap-4 mt-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Min Temperature (°C)</label>
                {{ form.optimal_temperature_min }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Max Temperature (°C)</label>
                {{ form.optimal_temperature_max }}
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Min pH</label>
                {{ form.optimal_ph_min }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Max pH</label>
                {{ form.optimal_ph_max }}
            </div>
        </div>
    </fieldset>
</div>
