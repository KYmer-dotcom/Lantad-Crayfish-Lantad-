<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Species</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Available Quantity</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for row in species_stock %}
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ row.species.name }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ row.available_quantity }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="px-6 py-12 text-center text-sm text-gray-500">No fish stock yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
