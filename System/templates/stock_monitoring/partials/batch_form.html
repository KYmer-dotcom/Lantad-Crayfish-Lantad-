<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pond *</label>
        {{ form.pond }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Species *</label>
            {{ form.species }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Batch Code *</label>
            {{ form.batch_code }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Stocking Date *</label>
            {{ form.stocking_date }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Stage *</label>
            {{ form.stage }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Initial Quantity (count) *</label>
            {{ form.initial_quantity }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Quantity (count) *</label>
            {{ form.current_quantity }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Initial Average Weight (g) *</label>
            {{ form.initial_average_weight }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Average Weight (g) *</label>
            {{ form.current_average_weight }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Supplier</label>
            {{ form.supplier }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cost Per Unit (₱)</label>
            {{ form.cost_per_unit }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
    <div>
        <label class="flex items-center">
            <input type="checkbox" class="rounded" name="is_active" {% if form.is_active.value %}checked{% endif %}>
            <span class="ml-2 text-sm text-gray-700">Is Active</span>
        </label>
    </div>
</div>
