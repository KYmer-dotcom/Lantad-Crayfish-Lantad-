<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Feed Type Name *</label>
        {{ form.name }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
            {{ form.brand }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
            {{ form.category }}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Protein Content (%)</label>
            {{ form.protein_content }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Price Per kg (₱)</label>
            {{ form.price_per_kg }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        {{ form.description }}
    </div>
    <div>
        <label class="flex items-center">
            <input type="checkbox" class="rounded" name="is_active" {% if form.is_active.value %}checked{% endif %}>
            <span class="ml-2 text-sm text-gray-700">Is Active</span>
        </label>
    </div>
</div>
