<div class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock Batch *</label>
        {{ form.stock_batch }}
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Feed Type *</label>
            {{ form.feed_type }}
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Quantity (kg) *</label>
            {{ form.quantity_kg }}
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Feeding Time *</label>
        {{ form.feeding_time }}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        {{ form.notes }}
    </div>
</div>
