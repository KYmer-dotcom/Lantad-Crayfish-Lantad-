{% comment %}
Button Component
Usage: {% include 'components/button.html' with text="Save" variant="primary" %}
Variants: primary, secondary, danger, success
Sizes: sm, md, lg
{% endcomment %}

{% if variant == 'primary' %}
    {% if size == 'sm' %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{ extra_class }}">
    {% elif size == 'lg' %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{ extra_class }}">
    {% else %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{ extra_class }}">
    {% endif %}

{% elif variant == 'secondary' %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{ extra_class }}">

{% elif variant == 'danger' %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 {{ extra_class }}">

{% elif variant == 'success' %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 {{ extra_class }}">

{% else %}
<button type="{{ type|default:'button' }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{ extra_class }}">
{% endif %}
    {{ text }}
</button>
