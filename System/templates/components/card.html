{% comment %}
Card Component
Usage: {% include 'components/card.html' with title="Card Title" %}
{% endcomment %}

<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden {{ extra_class }}">
    {% if title %}
    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-gray-900">{{ title }}</h3>
        {% if action %}
        <div>{{ action }}</div>
        {% endif %}
    </div>
    {% endif %}
    <div class="{% if not no_padding %}p-6{% endif %}">
        {{ content }}
    </div>
</div>
